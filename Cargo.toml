[package]
name = "cull-sidecar"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local Rust photo-culling backend that runs beside an Electron app"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rayon = "1.10"
memmap2 = "0.9"
kamadak-exif = "0.5"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = 1
